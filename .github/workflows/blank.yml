# This is a basic workflow to help you get started with Actions

name: foo

on:
  workflow_dispatch:
    inputs:
      text:
        type: string
      num:
        type: number
      bool:
        type: boolean

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '--- github.event.inputs ---'
          echo '${{ toJson(github.event.inputs) }}'
          echo '--- inputs ---'
          echo '${{ toJson(inputs) }}'
          echo '${{ toJson('a') }}'
          echo '${{ toJson('') }}'
          echo '${{ toJson(10) }}'
          echo '${{ toJson(null) }}'
      - env:
          foo: ok
          bar: 'a${{ inputs.text }}'
          baz: inputs.text
        run: |
          echo '${{ env.foo }}, ${{ env.bar }}, ${{ env.baz }}'
